name: CI with Cache
on: 
  - push
  - pull_request
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: prime-cache-fac69f3
        id: cache-step
        uses: actions/cache@v4
        with:
          key: cache-fac69f3
          path: ~/.npm
      
      - name: Echo cache result
        run: echo "Cache hit: ${{ steps.cache-step.outputs.cache-hit }}"
